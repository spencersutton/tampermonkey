preview = true
show-fixes = true

[lint]
isort.split-on-trailing-comma = false

extend-select = [
    "ANN",
    "B",
    "C",
    "duplicate-bases",
    "FURB",
    "I",
    "invalid-first-argument-name-for-class-method",
    "invalid-first-argument-name-for-method",
    "manual-from-import",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "useless-return",
]
allowed-confusables = ["’", "–"]

[format]
skip-magic-trailing-comma = true
