    "FURB",
    "I",
    "PLR1711",
    "PLR6301",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "PLR0402",
    "PLE0241",
    "N805",
    "N804",
]
ignore = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN202",
    "ANN204",
    "ANN206",
    "ANN401",
    "B008",
    "B028",
    "B901",
    "B905",
    "C901",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
]

